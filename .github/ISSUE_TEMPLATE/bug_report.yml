name: Website Bug Report
description: Report a broken link, visual regression, or build defect on frozenlab.dev.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Please report bugs related to the FrozenLab website and documentation platform. For tool-specific code bugs, please open an issue in that tool's dedicated repository.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps lead to the defect?
      placeholder: |
        1. Go to '/docs/...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & Browser
      placeholder: macOS 15, Chrome 130 / Node.js 22
